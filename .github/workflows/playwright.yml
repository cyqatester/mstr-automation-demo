name: Playwright CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test (dev, test, or prod)
        required: true
        default: test
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Desktop and mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_ENV: ${{ github.event.inputs.environment || 'test' }}
      BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report and diagnostics
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore